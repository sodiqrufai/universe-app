<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UniVerse — one app, every student. Campus feed, marketplace, services, events and messaging for Nigerian university students.">

  <!--
    Faster first load on a cold server: open the connections the app will need
    right away, and send a tiny request to wake the backend (Render's free tier
    sleeps) while the browser is still downloading the app itself. The URL must
    match lib/config/api_config.dart. The reply is ignored.
  -->
  <link rel="preconnect" href="https://universe-app-w4cc.onrender.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <script>
    try {
      fetch('https://universe-app-w4cc.onrender.com/health', { mode: 'no-cors', cache: 'no-store' }).catch(function () {});
    } catch (e) {}
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="theme-color" content="#4F2CCF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniVerse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UniVerse</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded loading screen, shown until Flutter paints its first frame. */
    html, body { margin: 0; background: #2D1B8C; }
    #uv-loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
      background: linear-gradient(160deg, #4F2CCF 0%, #2D1B8C 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.3s ease;
    }
    #uv-loader.uv-hide { opacity: 0; pointer-events: none; }
    #uv-loader img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 0 48px rgba(255, 255, 255, 0.18);
    }
    #uv-loader .uv-name { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    #uv-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: uv-spin 0.9s linear infinite;
    }
    #uv-loader .uv-note {
      min-height: 40px;
      max-width: 280px;
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: #E4DEFF;
    }
    @keyframes uv-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #uv-spinner { animation-duration: 3s; }
      #uv-loader { transition: none; }
    }

    #install-banner {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      background: #2D1B8C;
      color: #F8FAFC;
      border-radius: 14px;
      padding: 14px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(7, 11, 26, 0.35);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #install-banner img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    #install-banner .install-body {
      flex: 1;
      min-width: 0;
    }
    #install-banner .install-title {
      font-weight: 700;
      font-size: 14px;
      margin: 0 0 2px 0;
    }
    #install-banner .install-subtitle {
      font-size: 12px;
      color: #94A3B8;
      margin: 0;
    }
    #install-btn {
      background: #FFFFFF;
      color: #2D1B8C;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #install-dismiss {
      background: none;
      border: none;
      color: #94A3B8;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="uv-loader" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <p class="uv-name">UniVerse</p>
    <div id="uv-spinner" aria-hidden="true"></div>
    <p class="uv-note" id="uv-note">Loading…</p>
  </div>
  <noscript>
    <p style="position:fixed;inset:0;z-index:10001;margin:0;padding:24px;display:flex;align-items:center;justify-content:center;text-align:center;background:#2D1B8C;color:#fff;font-family:sans-serif;">
      UniVerse needs JavaScript. Please turn it on and reload.
    </p>
  </noscript>
  <script>
    (function () {
      var loader = document.getElementById('uv-loader');
      var note = document.getElementById('uv-note');
      var timers = [];

      // After ~8 s tell people why it is slow instead of leaving a silent spinner.
      timers.push(setTimeout(function () {
        note.textContent = 'Waking up UniVerse… this can take up to a minute the first time.';
      }, 8000));
      timers.push(setTimeout(function () {
        note.textContent = 'Still working. If nothing happens, check your internet connection and refresh the page.';
      }, 45000));

      function hide() {
        timers.forEach(clearTimeout);
        loader.classList.add('uv-hide');
        setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 400);
      }

      // Flutter fires this on window when its first frame has been painted.
      window.addEventListener('flutter-first-frame', hide);
    })();
  </script>

  <!--
    Custom install banner — Android/Chrome gets a real Install button
    (via the captured beforeinstallprompt event); iOS Safari never
    fires that event at all (no such API exists there), so it gets
    manual "Add to Home Screen" instructions instead. Both dismiss
    permanently, and both hide automatically once actually installed.
  -->
  <div id="install-banner">
    <img src="icons/Icon-192.png" alt="UniVerse">
    <div class="install-body">
      <p class="install-title">Install the UniVerse app</p>
      <p class="install-subtitle" id="install-subtitle">Get quick, full-screen access from your home screen.</p>
    </div>
    <button id="install-btn">Install</button>
    <button id="install-dismiss" aria-label="Dismiss">&times;</button>
  </div>
  <script>
    (function () {
      var LS_KEY = 'universe_install_banner_dismissed';
      var banner = document.getElementById('install-banner');
      var installBtn = document.getElementById('install-btn');
      var subtitle = document.getElementById('install-subtitle');
      var dismissBtn = document.getElementById('install-dismiss');
      var deferredPrompt = null;

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
      }

      function isIOS() {
        return /iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream;
      }

      function alreadyDismissed() {
        return localStorage.getItem(LS_KEY) === '1';
      }

      function dismiss() {
        banner.style.display = 'none';
        localStorage.setItem(LS_KEY, '1');
      }

      function showBanner() {
        if (isStandalone() || alreadyDismissed()) return;
        banner.style.display = 'flex';
      }

      if (isIOS()) {
        // No install API exists on iOS Safari at all -- this is the
        // only path onto a home screen there, so show it directly
        // instead of waiting for an event that will never fire.
        installBtn.style.display = 'none';
        subtitle.textContent = 'Tap the Share icon, then "Add to Home Screen".';
        showBanner();
      } else {
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredPrompt = e;
          showBanner();
        });
      }

      installBtn.addEventListener('click', function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          banner.style.display = 'none';
        });
      });

      dismissBtn.addEventListener('click', dismiss);

      // Fires on Android/Chrome once the install actually completes.
      // iOS has no equivalent event -- there, isStandalone() catches
      // it correctly on the user's next visit after they've installed.
      window.addEventListener('appinstalled', dismiss);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
